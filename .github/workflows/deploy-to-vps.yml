name: Deploy to VPS

# Deploys the image published by the Release workflow. A manual run accepts a
# tag for rollbacks; the automatic run uses the tag that triggered the release.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull image and deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      IMAGE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
      SERVER_URL: ${{ secrets.SERVER_URL }}
      SQLITE_PASSWORD: ${{ secrets.SQLITE_PASSWORD }}
      VALKEY_PASSWORD: ${{ secrets.VALKEY_PASSWORD }}
      ADMIN_MAIL: ${{ secrets.ADMIN_MAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
      REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
      WS_ACCESS_TOKEN_SECRET: ${{ secrets.WS_ACCESS_TOKEN_SECRET }}
      FIREBASE_JSON_BASE64: ${{ secrets.FIREBASE_JSON_BASE64 }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG,PROJECT_PATH,SERVER_URL,SQLITE_PASSWORD,VALKEY_PASSWORD,ADMIN_MAIL,SMTP_HOST,SMTP_USER,SMTP_PASSWORD,ACCESS_TOKEN_SECRET,REFRESH_TOKEN_SECRET,WS_ACCESS_TOKEN_SECRET,FIREBASE_JSON_BASE64
          script: |
            set -euo pipefail

            ACTUAL_PATH="$PROJECT_PATH/whisper-server"
            if [ -d "$ACTUAL_PATH/.git" ]; then
              cd "$ACTUAL_PATH"
              git fetch --tags --prune origin
            else
              mkdir -p "$ACTUAL_PATH"
              cd "$ACTUAL_PATH"
              git init
              git remote add origin https://github.com/jsfraz/whisper-server.git
              git fetch --tags origin
            fi
            # Use the compose file from the tag being deployed.
            git checkout -f "$IMAGE_TAG"

            mkdir -p data
            {
              printf 'SERVER_URL=%s\n' "$SERVER_URL"
              printf 'SQLITE_PASSWORD=%s\n' "$SQLITE_PASSWORD"
              printf 'VALKEY_PASSWORD=%s\n' "$VALKEY_PASSWORD"
              printf 'ADMIN_MAIL=%s\n' "$ADMIN_MAIL"
              printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
              printf 'SMTP_USER=%s\n' "$SMTP_USER"
              printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
              printf 'ACCESS_TOKEN_SECRET=%s\n' "$ACCESS_TOKEN_SECRET"
              printf 'REFRESH_TOKEN_SECRET=%s\n' "$REFRESH_TOKEN_SECRET"
              printf 'WS_ACCESS_TOKEN_SECRET=%s\n' "$WS_ACCESS_TOKEN_SECRET"
            } > .env.prod
            printf '%s' "$FIREBASE_JSON_BASE64" | base64 --decode > data/firebase.json

            PREVIOUS_TAG="$(cat .whisper-image-tag 2>/dev/null || true)"

            deploy() {
              export WHISPER_IMAGE_TAG="$1"
              echo "Deploying $WHISPER_IMAGE_TAG"
              docker compose -f docker-compose.prod.yml --env-file .env.prod pull whisper-server
              docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
              for _ in $(seq 1 36); do
                status="$(docker inspect -f '{{.State.Health.Status}}' whisper-server 2>/dev/null || echo starting)"
                case "$status" in
                  healthy) return 0 ;;
                  unhealthy) return 1 ;;
                esac
                sleep 5
              done
              return 1
            }

            if deploy "$IMAGE_TAG"; then
              printf '%s\n' "$IMAGE_TAG" > .whisper-image-tag
            else
              echo "Deploy of $IMAGE_TAG failed"
              if [ -n "$PREVIOUS_TAG" ]; then
                echo "Rolling back to $PREVIOUS_TAG"
                deploy "$PREVIOUS_TAG" || echo "Rollback to $PREVIOUS_TAG failed"
              fi
              exit 1
            fi

      - name: Open or update deploy failure issue
        if: failure()
        uses: actions/github-script@v7
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          script: |
            const title = '[deploy] Production deploy failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Deploy of \`${process.env.IMAGE_TAG}\` failed. Run: ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close deploy failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[deploy] Production deploy failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            for (const issue of issues.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'A later production deploy succeeded; closing this alert.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
