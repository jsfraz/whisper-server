name: whisper

services:

  whisper-server:
    container_name: whisper-server
    image: ghcr.io/jsfraz/whisper-server:${WHISPER_IMAGE_TAG:?WHISPER_IMAGE_TAG is required}
    pull_policy: always
    restart: always
    ports:
       - "127.0.0.1:8081:8080"
    volumes:
       - /etc/localtime:/etc/localtime:ro
       - whisper_data:/app/data
       - ./data/firebase.json:/app/data/firebase.json
    depends_on:
      - whisper-valkey
    environment:
      - GIN_MODE=release
      - SERVER_URL=${SERVER_URL}
      - SQLITE_PASSWORD=${SQLITE_PASSWORD}
      - VALKEY_HOST=whisper-valkey
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
      - ADMIN_MAIL=${ADMIN_MAIL}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - WS_ACCESS_TOKEN_SECRET=${WS_ACCESS_TOKEN_SECRET}
  
  # Valkey needs vm.overcommit_memory=1 on the host (background saves fail under low
  # memory otherwise). It is a kernel-wide setting, not namespaced, so it cannot be set
  # with `sysctls:`; this one-shot writes the host file without privileged mode.
  whisper-valkey-sysctl:
    image: valkey/valkey:9-alpine
    container_name: whisper-valkey-sysctl
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 1 > /mnt/overcommit_memory && echo 'vm.overcommit_memory=1' || echo 'WARNING: could not set vm.overcommit_memory, set it on the host, see docs/runbook.md'"]
    volumes:
      # Bind the single sysctl file; runc refuses a bind mount inside /proc.
      - /proc/sys/vm/overcommit_memory:/mnt/overcommit_memory

  whisper-valkey:
    image: valkey/valkey:9-alpine
    container_name: whisper-valkey
    restart: always
    command: /bin/sh -c "redis-server --requirepass ${VALKEY_PASSWORD} --save 60 1 --loglevel warning --notify-keyspace-events Ex"
    volumes:
      - valkey_data:/data

volumes:
  valkey_data:
  whisper_data:
